name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  golden:
    name: Kotlin matches TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install kotlinc
        run: |
          curl -sSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          echo /tmp/kotlinc/bin >> "$GITHUB_PATH"
      - run: npm run golden:kotlin

  android:
    name: release APK (${{ matrix.app }})
    needs: js
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider, customer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/${{ matrix.app }}
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
        working-directory: apps/${{ matrix.app }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: retake-${{ matrix.app }}-arm64
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
